<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Experience</title>
  <style>
    /* Import Google Font */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }

    .section {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-bottom: 30px;
    }

    .section-title {
      color: #007bff;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr;
      grid-gap: 20px;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .button-container {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
    }

    .button-container button,
    .button-container a {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .button-container a {
      background-color: #6c757d;
    }

    .button-container button:hover {
      background-color: #0056b3;
    }

    .button-container a:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <h2 class="section-title">Edit Experience</h2>
      <form action="{{ url_for('edit_experience', user_id=user_id, experience_id=experience_id) }}" method="POST">
        <input type="text" name="location" value="{{ experience[0] }}" placeholder="Location" required />
        <input type="text" name="destination" value="{{ experience[1] }}" placeholder="Destination" required />
        <textarea name="description" placeholder="Description" required>{{ experience[2] }}</textarea>
        <div class="button-container">
          <button type="submit">Update Experience</button>
          <a href="{{ url_for('profile', user_id=user_id) }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome, {{ user[1] }}!</title>
  <style>
    /* Import Google Font */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }

    .section {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-bottom: 30px;
    }

    .section-title {
      color: #007bff;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .plans-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #e6e6e6;
    }

    .plans-list li:last-child {
      border-bottom: none;
    }

    .plans-list h3 {
      color: #333;
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .plans-list p {
      color: #666;
      font-size: 16px;
      margin: 5px 0 0 0;
    }

    .new-experience {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-gap: 20px;
    }

    .new-experience input, .new-experience textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .new-experience button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .experiences-list .experience-item {
      background-color: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .experiences-list .experience-item h3 {
      color: #333;
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .back-link {
      display: inline-block;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      margin-top: 20px;
    }

    .back-link:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <h1 class="section-title">Welcome, {{ user[1] }}!</h1>

     

      <div class="section">
        <h2 class="section-title">Add a New Experience</h2>
        <form action="{{ url_for('add_experience', user_id=user[0]) }}" method="POST" class="new-experience">
            <input type="text" name="location" placeholder="Location" required />
            <input type="text" name="destination" placeholder="Destination" required />
            <textarea name="description" placeholder="Description" required></textarea>
            <button type="submit">Add Experience</button>
        </form>
    </div>
    

      <div class="section">
        <h2 class="section-title">Your Experiences</h2>
        <div class="experiences-list">
          {% for exp in experiences %}
          <div class="experience-item">
            <h3>{{ exp[1] }}</h3> <!-- Destination -->
            <p><strong>Location:</strong> {{ exp[0] }}</p>
            <p><strong>Description:</strong> {{ exp[2] }}</p>
            <p><strong>Date Added:</strong> {{ exp[3] }}</p>
            
            <!-- Edit Button -->
            <form action="{{ url_for('edit_experience', user_id=user[0], experience_id=exp[4]) }}" method="GET" style="display:inline;">
              <button type="submit">Edit</button>
            </form>
            
            <!-- Delete Button -->
            <form action="{{ url_for('delete_experience', user_id=user[0], experience_id=exp[4]) }}" method="POST" style="display:inline;">
              <button type="submit" onclick="return confirm('Are you sure you want to delete this experience?');">Delete</button>
            </form>
          </div>
          {% endfor %}
        </div>
      </div>
      

      <a href="{{ url_for('home') }}" class="back-link">Back to Home</a>
    </div>
  </div>
</body>
</html>

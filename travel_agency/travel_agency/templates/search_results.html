<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .results-list {
            list-style: none;
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .result-card {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 1rem;
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .destination-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .destination-details {
            color: #666;
            font-size: 0.95rem;
        }

        .location-tag {
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 1.1rem;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 0 auto;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.6s ease-out;
        }

        .result-card {
            animation: fadeIn 0.6s ease-out;
            animation-fill-mode: both;
        }

        .results-list > * {
            animation-delay: calc(0.1s * var(--animation-order, 0));
        }

        @media (max-width: 600px) {
            .result-card {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .location-tag {
                justify-self: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search Results</h1>
        {% if destinations %}
            <ul class="results-list">
                {% for destination in destinations %}
                    <li class="result-card" style="--animation-order: {{ loop.index }}">
                        <div>
                            <div class="destination-name">{{ destination[0] }}</div>
                            <div class="destination-details">{{ destination[1] }}</div>
                        </div>
                        <span class="location-tag">{{ destination[2] }}</span>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="no-results">
                <p>No destinations found for this location.</p>
            </div>
        {% endif %}
        
        <a href="{{ url_for('home') }}" class="back-button">Back to Home</a>
    </div>
</body>
</html>
